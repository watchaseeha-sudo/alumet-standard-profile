<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ถอดแบบงานอลูมิเนียม ALUMET</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:16px;background:#f0f2f5;color:#222;padding:20px}
h1{font-size:22px;font-weight:700;margin-bottom:16px;color:#1860a8}
h2{font-size:17px;font-weight:700;color:#1860a8;margin-bottom:12px}
.page{display:none}.page.show{display:block}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin-bottom:16px}
.sl{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
/* ประเภทบาน */
.cat-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cat-tab{padding:10px 20px;border-radius:8px;border:2px solid #ccc;background:#fff;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600}
.cat-tab:hover{border-color:#1860a8;background:#f0f7ff}
.cat-tab.on{border-color:#1860a8;background:#1860a8;color:#fff}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.tb{padding:14px 6px;border-radius:8px;border:2px solid #ccc;background:#fff;font-size:14px;cursor:pointer;text-align:center;font-family:inherit;line-height:1.4}
.tb:hover{border-color:#1860a8;background:#f0f7ff}
.tb.on{border-color:#1860a8;background:#dff0ff;color:#0a3d7c;font-weight:700}
/* grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.g5{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
/* fields */
.fd{display:flex;flex-direction:column;gap:6px}
.fd label{font-size:13px;color:#555;font-weight:600}
.fd input,.fd select{height:44px;padding:0 12px;border-radius:8px;border:2px solid #ccc;font-size:15px;font-family:inherit;width:100%}
.fd input:focus,.fd select:focus{outline:none;border-color:#1860a8}
/* diagram */
.dg{display:flex;border:2px solid #bbb;border-radius:8px;overflow:hidden;height:66px;margin-bottom:14px}
.dr{background:#e0e0e0;width:16px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#888;writing-mode:vertical-rl}
.dp{flex:1;display:flex;align-items:center;justify-content:center;border-left:1px solid #bbb;flex-direction:column;gap:2px}
.dp.ds{background:#dff0ff}.dp.df{background:#fff5e0}
.dw{font-size:14px;font-weight:700}.dt{font-size:11px;color:#888}
/* hint */
.ht{font-size:14px;color:#333;padding:12px 16px;background:#f0f7ff;border-radius:8px;border-left:4px solid #1860a8;margin-bottom:14px;line-height:1.9}
/* frame grid */
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.fc{background:#f7f9fc;border:2px solid #e0e0e0;border-radius:8px;padding:12px}
.fl{font-size:13px;font-weight:700;color:#444;margin-bottom:8px}
.fc select{width:100%;height:40px;padding:0 10px;border-radius:6px;border:2px solid #ccc;font-size:13px;font-family:inherit;margin-bottom:6px}
.fw{font-size:12px;color:#1860a8;font-weight:600;min-height:18px}
/* thick */
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.tc{background:#f7f9fc;border:2px solid #e0e0e0;border-radius:8px;padding:14px}
.tc .fl{font-size:14px;font-weight:700;color:#333;margin-bottom:10px}
.tc select{width:100%;height:42px;padding:0 10px;border-radius:6px;border:2px solid #ccc;font-size:14px;font-family:inherit;margin-bottom:8px}
.tc .info{font-size:12px;color:#666;line-height:1.9}
/* item list */
.item-list{margin-bottom:14px}
.item-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f7f9fc;border:2px solid #e0e0e0;border-radius:8px;margin-bottom:10px}
.item-no{font-size:20px;font-weight:700;color:#1860a8;min-width:32px}
.item-info{flex:1;line-height:1.9;font-size:14px}
.item-del{height:38px;padding:0 14px;border-radius:6px;border:2px solid #ffaaaa;background:#fff5f5;color:#cc0000;font-size:14px;cursor:pointer;font-family:inherit}
.item-del:hover{background:#ffdddd}
/* buttons */
.btn-add{width:100%;height:52px;border-radius:8px;border:2px dashed #1860a8;background:#f0f7ff;color:#1860a8;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:12px}
.btn-add:hover{background:#dff0ff}
.bc{width:100%;height:56px;border-radius:8px;border:none;background:#1860a8;color:#fff;font-size:19px;font-weight:700;cursor:pointer;font-family:inherit}
.bc:hover{background:#0f4a87}.bc:active{transform:scale(.98)}
/* result */
.bk{height:48px;padding:0 24px;border-radius:8px;border:2px solid #1860a8;background:#fff;color:#1860a8;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:16px}
.bk:hover{background:#f0f7ff}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.me{background:#1860a8;border-radius:10px;padding:16px 18px}
.ml{font-size:12px;color:#a8d0ff;margin-bottom:4px;font-weight:600}
.mv{font-size:22px;font-weight:700;color:#fff}
.mb{font-size:13px;color:#a8d0ff;margin-top:2px}
.ts{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ta{padding:10px 20px;border-radius:8px;border:2px solid #ccc;background:#fff;color:#777;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600}
.ta.on{background:#dff0ff;color:#0a3d7c;border-color:#1860a8}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:700;color:#555;border-bottom:2px solid #e0e0e0;padding:10px 8px;font-size:13px;background:#f7f9fc}
td{padding:9px 8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tfr td{font-weight:700;background:#f0f7ff;padding:11px 8px;font-size:15px}
.fb2{background:#f7f9fc;border-radius:8px;padding:14px 18px;margin-bottom:14px;font-size:14px;color:#444;line-height:2.1;border-left:4px solid #1860a8}
.fb2 b{color:#1860a8}
.pr{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:16px}
.pr:last-child{border-bottom:none}
.tr2{display:flex;justify-content:space-between;padding:14px 0 4px;margin-top:8px;border-top:2px solid #1860a8}
.gb{background:#dff0ff;border:2px solid #1860a8;border-radius:8px;padding:12px 16px;margin-bottom:10px;font-size:15px;color:#0a3d7c;font-weight:600}
.go{border:1px solid #e0e0e0;border-radius:6px;padding:9px 14px;margin-bottom:6px;font-size:14px}
.st{font-size:18px;font-weight:700;color:#1860a8;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #dff0ff}
.item-header{background:#1860a8;color:#fff;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:700;margin-bottom:10px}
.job-title{font-size:20px;font-weight:700;color:#1860a8;margin-bottom:4px}
.job-sub{font-size:14px;color:#888;margin-bottom:16px}
</style>
</head>
<body>

<!-- หน้ากรอกข้อมูล -->
<div class="page show" id="pg-in">
<h1>ถอดแบบงานอลูมิเนียม ALUMET</h1>

<!-- 1. ชื่องาน -->
<div class="card">
  <div class="sl">ข้อมูลงาน</div>
  <div class="fd"><label>ชื่องาน</label><input type="text" id="JN" placeholder="เช่น บ้านคุณสมชาย"></div>
  <div class="fd" style="margin-top:10px"><label>ชื่อชุดที่จะเพิ่ม</label><input type="text" id="INAME" placeholder="เช่น ห้องนอน, ห้องนั่งเล่น"></div>
</div>

<!-- 2. สีอลูมิเนียม / 3. สีกระจก -->
<div class="card">
  <div class="sl">สีและวัสดุ</div>
  <div class="g3">
    <div class="fd"><label>สีอลูมิเนียม</label>
      <select id="COL">
        <option value="p">สีอบขาว (พ่น)</option>
        <option value="p">สีขาวฟ้า (พ่น)</option>
        <option value="p">สีดำพ่น</option>
        <option value="a">สีดำชุบ</option>
        <option value="a">สีชา (ชุบ)</option>
        <option value="a">สีอลูมิเนียม (ชุบ)</option>
      </select>
    </div>
    <div class="fd"><label>สีกระจก</label>
      <select id="GCOL">
        <option value="clear">กระจกใส</option>
        <option value="green">กระจกเขียวใส</option>
        <option value="bronze">กระจกชา</option>
        <option value="frosted">กระจกฝ้า</option>
        <option value="oneway">กระจกวันเวย์</option>
        <option value="blue">กระจกฟ้าใส</option>
      </select>
    </div>
    <div class="fd"><label>ความหนากระจก</label>
      <select id="GTHK">
        <option value="5">5 มม.</option>
        <option value="6" selected>6 มม.</option>
        <option value="8">8 มม.</option>
        <option value="10">10 มม.</option>
        <option value="12">12 มม.</option>
      </select>
    </div>
  </div>
</div>

<!-- 4. หมวดบาน + ประเภท + ขนาด + เฟรม -->
<div class="card">
  <div class="sl">ประเภทบาน</div>
  <div class="cat-tabs">
    <button class="cat-tab on" data-cat="slide">บานเลื่อน</button>
    <button class="cat-tab" data-cat="swing">บานสวิง</button>
  </div>
  <div id="type-area">
    <div class="tg" id="tg"></div>
  </div>
  <!-- บานสวิง -->
  <div id="swing-area" style="display:none">
    <div class="tg" id="tg-swing"></div>
    <!-- ตัวเลือกเพิ่มเติมสำหรับบานสวิง+ช่องแสง -->
    <div id="light-options" style="display:none;margin-bottom:14px">
      <div class="g3" style="margin-bottom:10px">
        <div class="fd"><label>ความสูงบานสวิง (ซม.)</label>
          <input type="number" id="swDoorH" value="200" min="100" step="1" oninput="updLightH()">
        </div>
        <div class="fd"><label>ความสูงช่องแสง (ซม.)</label>
          <input type="number" id="swLightH" readonly style="background:#f5f5f5;color:#888">
        </div>
        <div class="fd" id="mid-type-fd" style="display:none"><label>เส้นกลางช่องแสง (บานคู่)</label>
          <select id="swMidType">
            <option value="groove">กล่องร่อง + ตบร่อง (3012+3014)</option>
            <option value="flat">กล่องเรียบ + ตบเรียบ (3013+3015)</option>
          </select>
        </div>
      </div>
    </div>
    <div class="tg2" style="margin-top:12px">
      <div class="tc">
        <div class="fl">ความหนากล่อง/เสา</div>
        <select id="thSW1"></select>
        <div class="info" id="infoSW1"></div>
      </div>
      <div class="tc">
        <div class="fl">ความหนาคิ้วประตู (3020)</div>
        <select id="thSW2"></select>
        <div class="info" id="infoSW2"></div>
      </div>
    </div>
  </div>
  <div id="dg"></div>
  <div id="hi"></div>
</div>

<!-- เลือกเฟรม -->
<div class="card" id="frame-card">
  <div class="sl">เลือกเฟรม</div>
  <div class="fg">
    <div class="fc">
      <div class="fl">เฟรมบน</div>
      <select id="sft"></select>
      <div class="fw" id="wft"></div>
    </div>
    <div class="fc">
      <div class="fl">เฟรมล่าง</div>
      <select id="sfb"></select>
      <div class="fw" id="wfb"></div>
    </div>
    <div class="fc">
      <div class="fl">เฟรมข้าง</div>
      <select id="sfs"></select>
      <div class="fw" id="wfs"></div>
    </div>
  </div>
</div>

<!-- 5. ความหนาเส้น -->
<div class="card">
  <div class="sl">ขนาดช่องและจำนวน</div>
  <div class="g3">
    <div class="fd"><label>กว้างช่อง (ซม.)</label>
      <input type="number" id="W" min="30" step="0.1" placeholder="กว้าง (ซม.)" oninput="uDg();rHint();updLightH()">
    </div>
    <div class="fd"><label>สูงช่อง (ซม.)</label>
      <input type="number" id="H" min="30" step="0.1" placeholder="สูง (ซม.)" oninput="uDg();rHint();updLightH()">
    </div>
    <div class="fd"><label>จำนวนชุด</label>
      <input type="number" id="QT" min="1" placeholder="จำนวนชุด">
    </div>
  </div>
  <!-- ช่องแสง: แสดงเมื่อเลือกบานสวิง+ช่องแสง -->
  <div id="light-options" style="display:none">
    <div class="g3" style="margin-top:8px">
      <div class="fd"><label>ความสูงบานสวิง (ซม.)</label>
        <input type="number" id="swDoorH" min="100" step="1" placeholder="ความสูงบานสวิง" oninput="updLightH()">
      </div>
      <div class="fd"><label>ความสูงช่องแสง (ซม.)</label>
        <input type="number" id="swLightH" readonly style="background:#f5f5f5;color:#888;height:40px;width:100%;border-radius:7px;border:1.5px solid #ccc;padding:0 10px;font-size:14px">
      </div>
      <div class="fd" id="mid-type-fd" style="display:none"><label>เส้นกลางช่องแสง (บานคู่)</label>
        <select id="swMidType">
          <option value="groove">กล่องร่อง + ตบร่อง</option>
          <option value="flat">กล่องเรียบ + ตบเรียบ</option>
        </select>
      </div>
    </div>
  </div>
</div>
<div class="card" id="thick-card">
  <div class="sl">ความหนาเส้น</div>
  <div class="tg2">
    <div class="tc">
      <div class="fl">กลุ่มเฟรม (บน / ล่าง / ข้าง)</div>
      <select id="thF"></select>
      <div class="info" id="infoF"></div>
    </div>
    <div class="tc">
      <div class="fl">กลุ่มบาน (ขวาง / เสา)</div>
      <select id="thS"></select>
      <div class="info" id="infoS"></div>
    </div>
  </div>
</div>

<!-- 6. ราคา -->
<div class="card">
  <div class="sl">ราคา</div>
  <div class="g2">
    <div class="fd"><label>ราคาอลูมิเนียม (บาท/กก.)</label><input type="number" id="AP" value="120" step="1"></div>
    <div class="fd"><label>ราคากระจก (บาท/ตร.ฟุต)</label><input type="number" id="GP" value="23" step="1"></div>
  </div>
</div>

<!-- 7. รายการที่เพิ่มแล้ว -->
<div id="list-card" style="display:none">
  <div class="card">
    <div class="sl">รายการที่เพิ่มแล้ว</div>
    <div class="item-list" id="item-list"></div>
  </div>
</div>

<!-- 8. ปุ่มเพิ่ม -->
<button class="btn-add" id="btn-add">+ เพิ่มรายการนี้</button>
<!-- 9. ปุ่มคำนวณ -->
<button class="bc" id="btnc" style="display:none">คำนวณทั้งหมด →</button>
</div>

<!-- หน้าผลลัพธ์ -->
<div class="page" id="pg-out">
<button class="bk" id="btnbk">← แก้ไขข้อมูล</button>
<div class="job-title" id="out-jn"></div>
<div class="job-sub" id="out-sub"></div>
<div class="ms" id="ms"></div>
<div class="ts" id="ts">
  <button class="ta on" data-t="pc">รายการตัด</button>
  <button class="ta" data-t="pb">เส้นที่ซื้อ</button>
  <button class="ta" data-t="pg">กระจก</button>
  <button class="ta" data-t="pp">ราคารวม</button>
</div>
<div class="card" id="pc"></div>
<div class="card" id="pb" style="display:none"></div>
<div class="card" id="pg" style="display:none"></div>
<div class="card" id="pp" style="display:none"></div>
</div>

<script>
var PD={
"4001":{n:"เฟรมบน บานเลื่อน",v:[{t:"1.0 Lite",a:4.2,p:4.4},{t:"1.5 Lite",a:5.6,p:5.6}]},
"4002":{n:"เฟรมล่าง บานเลื่อน",v:[{t:"0.8 Lite",a:3.1,p:3.2},{t:"1.0 Lite",a:3.4,p:3.5},{t:"1.5 Lite",a:4.4,p:4.5}]},
"4003":{n:"เฟรมข้าง บานเลื่อน",v:[{t:"1.0 Lite",a:3.3,p:3.3},{t:"1.2 Plus",a:4.3,p:4.3}]},
"4004":{n:"เฟรมบน 3 นิ้ว",v:[{t:"0.8",a:3.6,p:3.85},{t:"1.0",a:4.05,p:4.3}]},
"4005":{n:"เฟรมล่าง 3 นิ้ว",v:[{t:"1.1",a:3.12,p:3.24}]},
"4006":{n:"เฟรมข้าง 3 นิ้ว",v:[{t:"1.0 Lite",a:2.8,p:2.95},{t:"1.2 Lite",a:3.2,p:3.35}]},
"4394":{n:"เฟรมล่างขาสูง ไม่มีฉาก",v:[{t:"1.1",a:5.25,p:5.5},{t:"1.2",a:5.5,p:5.8},{t:"1.5",a:6.2,p:6.5}]},
"4800":{n:"เฟรมล่างขาสูง มีฉาก",v:[{t:"1.5",a:6.77,p:7.03},{t:"1.8",a:7.63,p:7.92}]},
"4869":{n:"เฟรมข้าง ติดกล่อง 4 นิ้ว",v:[{t:"1.0 Lite",a:5.1,p:5.3},{t:"1.0 Plus",a:5.5,p:5.7},{t:"1.5 Extra Lite",a:6.65,p:6.9},{t:"1.5 Lite",a:7.0,p:7.2},{t:"1.9 Plus",a:8.85,p:9.0}]},
"4870":{n:"เฟรมบน ติดกล่อง 4 นิ้ว",v:[{t:"1.0 Lite",a:5.9,p:6.1},{t:"1.0",a:6.3,p:6.5},{t:"1.5 Lite",a:7.6,p:7.8},{t:"1.8 Plus",a:10.15,p:10.35}]},
"4871":{n:"เฟรมล่าง ติดกล่อง 4 นิ้ว",v:[{t:"1.0 Lite",a:5.8,p:6.2},{t:"1.0 Plus",a:6.3,p:6.6},{t:"1.2",a:6.9,p:7.2},{t:"2.0",a:10.6,p:10.85}]},
"14008":{n:"เฟรมล่าง 3 ราง",v:[{t:"1.5",a:4.75,p:4.94}]},
"14009":{n:"เฟรมข้าง 3 ราง",v:[{t:"1.3",a:5.27,p:5.48},{t:"1.5",a:5.94,p:6.17}]},
"14010":{n:"เฟรมบน 3 ราง",v:[{t:"1.2 Lite",a:5.8,p:6.0},{t:"1.3",a:6.24,p:6.48}]},
"020043":{n:"เฟรมล่าง 3 ราง ไม่มีปีก",v:[{t:"1.5",a:4.54,p:4.72}]},
"020052":{n:"เฟรมล่าง 3 ราง มีปีก",v:[{t:"1.3",a:4.81,p:5.0}]},
"020070":{n:"เฟรมบน ติดกล่อง 3 นิ้ว",v:[{t:"1.2",a:6.6,p:6.86}]},
"020071":{n:"เฟรมข้าง ติดกล่อง 3 นิ้ว",v:[{t:"1.2",a:5.65,p:5.87}]},

function calcBars(pieces){
  var all=[];
  pieces.forEach(function(p){for(var i=0;i<p.qty;i++)all.push(p.dim);});
  all.sort(function(a,b){return b-a;});
  var bars=[];
  all.forEach(function(d){
    var placed=false;
    for(var i=0;i<bars.length;i++){if(bars[i]>=d){bars[i]-=d;placed=true;break;}}
    if(!placed){bars.push(BAR-d);}
  });
  return bars.length;
}

  });
  g("pc").innerHTML=ch;

  var bh='<div class="st">สรุปเส้นที่ต้องซื้อทั้งงาน</div>'+
    '<table><thead><tr><th style="width:25%">รายการ</th><th style="width:35%">ชื่อเส้น</th><th>จำนวนเส้น</th><th>น้ำหนัก/เส้น</th><th>น้ำหนักรวม(กก.)</th><th>ราคา(บาท)</th></tr></thead><tbody>';
  var sB=0,sK=0,sC=0;
  Object.keys(piecesByCode).forEach(function(k){
    var gg=piecesByCode[k];var tw=rn(gg.nb*gg.w,2);var cost=rn(tw*ap,0);sB+=gg.nb;sK+=tw;sC+=cost;
    var nm=PD[gg.c]?PD[gg.c].n:gg.c;
    bh+='<tr><td><b>'+gg.n+'</b></td><td style="font-size:13px;color:#555">'+nm+'</td><td><b style="color:#1860a8">'+gg.nb+' เส้น</b></td><td>'+gg.w+' กก.</td><td>'+fm(tw,2)+'</td><td>฿'+fm(cost)+'</td></tr>';
  });
  bh+='</tbody><tfoot><tr class="tfr"><td colspan="2">รวมทั้งหมด</td><td><b>'+sB+' เส้น</b></td><td></td><td><b>'+fm(rn(sK,2),2)+' กก.</b></td><td><b>฿'+fm(rn(sC,0))+'</b></td></tr></tfoot></table>';
  g("pb").innerHTML=bh;

  var gh='<div class="st">กระจก '+gColTxt+' '+gThk+' มม.</div>';
  ITEMS.forEach(function(item,idx){
    if(item.cat==="swing"){
      var r2=allResults[idx];
      var gWi2=rn(r2.gWc/2.54,2),gHi2=rn(r2.gHc/2.54,2);
      var best2=fBest(r2.gWc,r2.gHc,1,gp);
      gh+='<div class="item-header">'+item.iname+' - '+T_LABELS[item.ct]+' '+item.W+'x'+item.H+' ซม. x'+item.qty+' ชุด</div>';
      gh+='<div class="fb2"><b>กระจก/บาน:</b> '+gWi2+'x'+gHi2+' นิ้ว ('+rn(gWi2*gHi2,1)+' ตร.นิ้ว)<br>กว้าง = เสาบน-ล่าง'+(r2.isDouble?' - 2.0':' - 1.0')+' = '+r2.gWc+' ซม. | สูง = เสาประตู - 14.0 = '+r2.gHc+' ซม.</div>';
      if(best2)gh+='<div class="gb">แนะนำ: <b>'+best2.w+'x'+best2.h+' นิ้ว</b> '+best2.m+' x'+item.qty+' = <b>฿'+fm(best2.c*item.qty)+'</b></div>';
      var seen2=[];
      GS.forEach(function(sz){[[sz[0],sz[1]],[sz[1],sz[0]]].forEach(function(o){
        if(o[0]>=gWi2&&o[1]>=gHi2){var lb=o[0]+"x"+o[1]+"s";if(seen2.indexOf(lb)<0){seen2.push(lb);var c=rn((o[0]*o[1]/144)*gp*item.qty,0);var ib=best2&&best2.w===o[0]&&best2.h===o[1]&&c===rn(best2.c*item.qty,0);gh+='<div class="go'+(ib?" gb":"")+'">'+o[0]+'x'+o[1]+' นิ้ว x'+item.qty+' = ฿'+fm(c)+'</div>';}}
      });});
      gh+='<br>';
      return;
    }
    var r=allResults[idx];var ns=r.T.sl;var qty=r.qty;
    var gWi=rn(r.gWc/2.54,2),gHi=rn(r.gHc/2.54,2);
    var best=fBest(r.gWc,r.gHc,ns,gp);
    gh+='<div class="item-header">'+item.iname+' - '+gWi+'x'+gHi+' นิ้ว | '+ns+' บาน x'+qty+' ชุด</div>';
    if(best)gh+='<div class="gb">แนะนำ: <b>'+best.w+'x'+best.h+' นิ้ว</b> '+best.m+' x'+qty+' = <b>฿'+fm(best.c*qty)+'</b></div>';
    var seen=[];
    GS.forEach(function(sz){[[sz[0],sz[1]],[sz[1],sz[0]]].forEach(function(o){
      if(o[0]>=gWi&&o[1]>=gHi){var lb=o[0]+"x"+o[1]+"s";if(seen.indexOf(lb)<0){seen.push(lb);var c=rn((o[0]*o[1]/144)*gp*ns*qty,0);var ib=best&&best.w===o[0]&&best.h===o[1]&&best.m.indexOf("แยก")>=0&&c===rn(best.c*qty,0);gh+='<div class="go'+(ib?" gb":"")+'">'+o[0]+'x'+o[1]+' แยก '+ns+' แผ่น x'+qty+' = ฿'+fm(c)+'</div>';}}
      if(ns>=2){if(o[0]>=gWi*ns&&o[1]>=gHi){var lb2=o[0]+"x"+o[1]+"h";if(seen.indexOf(lb2)<0){seen.push(lb2);var c=rn((o[0]*o[1]/144)*gp*qty,0);var ib=best&&best.w===o[0]&&best.h===o[1]&&best.m.indexOf("นอน")>=0&&c===rn(best.c*qty,0);gh+='<div class="go'+(ib?" gb":"")+'">'+o[0]+'x'+o[1]+' แผ่นเดียวแนวนอน x'+qty+' = ฿'+fm(c)+'</div>';}}if(o[0]>=gWi&&o[1]>=gHi*ns){var lb3=o[0]+"x"+o[1]+"v";if(seen.indexOf(lb3)<0){seen.push(lb3);var c=rn((o[0]*o[1]/144)*gp*qty,0);var ib=best&&best.w===o[0]&&best.h===o[1]&&best.m.indexOf("ตั้ง")>=0&&c===rn(best.c*qty,0);gh+='<div class="go'+(ib?" gb":"")+'">'+o[0]+'x'+o[1]+' แผ่นเดียวแนวตั้ง x'+qty+' = ฿'+fm(c)+'</div>';}}}
    });});
    gh+='<br>';
  });
  g("pg").innerHTML=gh;

  var ph='<div class="st">ราคารวมทั้งงาน</div><div style="font-size:19px;font-weight:700;margin-bottom:14px">'+jn+'</div>';
  ITEMS.forEach(function(item,idx){
    var r=allResults[idx];var lbl=T_LABELS[item.ct]||item.ct;
    var best=r.cat==="slide"?fBest(r.gWc,r.gHc,r.T.sl,gp):fBest(r.gWc,r.gHc,1,gp);
    var gc=best?rn(best.c*item.qty,0):0;
    ph+='<div class="pr"><span><b>'+item.iname+'</b> | '+lbl+' '+item.W+'x'+item.H+' x'+item.qty+'ชุด</span><span>กระจก ฿'+fm(gc)+'</span></div>';
  });
  ph+='<div class="tr2"><span style="font-weight:700;font-size:18px">รวมอลูมิเนียม</span><span style="font-size:21px;font-weight:700">฿'+fm(alCost)+'</span></div>';
  ph+='<div class="tr2"><span style="font-weight:700;font-size:18px">รวมกระจก</span><span style="font-size:21px;font-weight:700">฿'+fm(gCostTotal)+'</span></div>';
  ph+='<div class="tr2" style="border-top:3px solid #1860a8"><span style="font-weight:700;font-size:21px">รวมทั้งหมด</span><span style="font-size:30px;font-weight:700;color:#1860a8">฿'+fm(alCost+gCostTotal)+'</span></div>';
  g("pp").innerHTML=ph;
  showTab("pc");showPage("pg-out");
}

g("tg").addEventListener("click",function(e){var b=e.target.closest("[data-ty]");if(!b)return;CT=b.getAttribute("data-ty");bTG();uDg();rHint();updLightH();});
g("tg-swing").addEventListener("click",function(e){var b=e.target.closest("[data-sw]");if(!b)return;CT_SWING=b.getAttribute("data-sw");bTGSwing();updSwingInfo();});
g("ts").addEventListener("click",function(e){var b=e.target.closest("[data-t]");if(!b)return;showTab(b.getAttribute("data-t"));});
g("item-list").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(!b)return;ITEMS.splice(parseInt(b.getAttribute("data-i")),1);renderItemList();if(ITEMS.length===0){g("list-card").style.display="none";g("btnc").style.display="none";}});
document.querySelectorAll(".cat-tab").forEach(function(btn){btn.addEventListener("click",function(){switchCat(this.getAttribute("data-cat"));});});
g("btn-add").addEventListener("click",addItem);
g("btnc").addEventListener("click",calcAll);
g("btnbk").addEventListener("click",function(){showPage("pg-in");});
g("sft").addEventListener("change",function(){updFrameInfo();rHint();});
g("sfb").addEventListener("change",function(){updFrameInfo();rHint();});
g("sfs").addEventListener("change",function(){updFrameThick();rHint();});
g("thF").addEventListener("change",updFrameInfo);
g("thS").addEventListener("change",updSashInfo);
g("COL").addEventListener("change",function(){updFrameInfo();updSashInfo();updSwingInfo();});
g("thSW1").addEventListener("change",updSwingInfo);
g("thSW2").addEventListener("change",updSwingInfo);
// W,H listeners now use oninput attribute

function updLightH(){
  var H=parseFloat(g("H").value)||0;
  var dH=parseFloat(g("swDoorH")?g("swDoorH").value:0)||0;
  var lH=g("swLightH");
  if(lH)lH.value=dH>0&&H>0?Math.round((H-dH)*10)/10:"";
}
window.addEventListener("DOMContentLoaded",function(){
fillFrameSels();bTG();bTGSwing();uDg();updFrameThick();updSashThick();updSwingThick();rHint();
});

</script>
