<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ถอดแบบงานอลูมิเนียม ALUMET</title>
<style>
:root{
  --pri:#1860a8;--pri-soft:#eef4fb;--pri-dk:#0f4a87;
  --bg:#f6f7f9;--card:#fff;
  --tx:#1a1d21;--tx2:#6b7280;--tx3:#9aa1ab;--line:#e6e8ec;
  --r:10px;--sh:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);padding:16px;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai","Sarabun",sans-serif}
h1{font-size:20px;font-weight:600;margin-bottom:16px}
h2{font-size:14px;font-weight:600;color:var(--tx2);margin-bottom:8px}
.page{display:none}.page.show{display:block}

/* การ์ด + หัวข้อย่อย */
.card{background:var(--card);border:0;border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.sl{font-size:12px;font-weight:600;color:var(--tx3);
  letter-spacing:.04em;margin-bottom:12px}

/* ประเภทบาน */
.cat-tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cat-tab{padding:9px 18px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--tx2);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s}
.cat-tab:hover{border-color:var(--pri);color:var(--pri)}
.cat-tab.on{border-color:var(--pri);background:var(--pri);color:#fff}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.tb{padding:12px 6px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--tx2);font-size:13px;cursor:pointer;
  text-align:center;font-family:inherit;line-height:1.4;transition:all .15s}
.tb:hover{border-color:var(--pri);color:var(--pri)}
.tb.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:600}

/* กริด */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}

/* ฟิลด์ */
.fd{display:flex;flex-direction:column;gap:4px}
.fd label{font-size:12px;color:var(--tx2);font-weight:500}
.fd input,.fd select{height:42px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--tx);
  font-size:15px;font-family:inherit;width:100%;
  transition:border-color .15s,box-shadow .15s}
.fd input:focus,.fd select:focus,select:focus,input:focus{outline:none;
  border-color:var(--pri);box-shadow:0 0 0 3px rgba(24,96,168,.12)}
.dgw{border:1px solid var(--line);border-radius:8px;background:#fff;
  padding:10px;margin-bottom:12px}
.dgs{display:block;width:100%;height:auto}
.dgc{text-align:center;font-size:13px;color:var(--tx2);
  font-weight:600;margin-top:6px}

/* คำอธิบายสูตร */
.ht{font-size:13px;color:var(--tx2);padding:12px 14px;background:var(--pri-soft);
  border-radius:8px;margin-bottom:12px;line-height:1.8}

/* เลือกเฟรม */
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.fc{background:var(--bg);border:0;border-radius:8px;padding:12px}
.fl{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.fc select{width:100%;height:40px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line);background:#fff;font-size:13px;
  font-family:inherit;margin-bottom:6px}
.fw{font-size:12px;color:var(--pri);font-weight:600;min-height:18px}

/* ความหนาเส้น */
.tg2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.tc{background:var(--bg);border:0;border-radius:8px;padding:14px}
.tc .fl{font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px}
.tc select{width:100%;height:42px;padding:0 10px;border-radius:8px;
  border:1px solid var(--line);background:#fff;font-size:14px;
  font-family:inherit;margin-bottom:8px}
.tc .info{font-size:12px;color:var(--tx2);line-height:1.9}

/* รายการที่เพิ่มแล้ว */
.item-list{margin-bottom:4px}
.item-row{display:flex;align-items:center;gap:12px;padding:12px 0;
  background:transparent;border:0;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:0}
.item-no{width:26px;height:26px;border-radius:50%;background:var(--pri-soft);
  color:var(--pri);font-size:12px;font-weight:600;flex:0 0 auto;
  min-width:26px;display:flex;align-items:center;justify-content:center}
.item-info{flex:1;min-width:0;line-height:1.6;font-size:14px}
.item-del{height:32px;padding:0 10px;border-radius:6px;border:0;
  background:transparent;color:#c0392b;font-size:13px;cursor:pointer;
  font-family:inherit;transition:background .15s}
.item-del:hover{background:#fdecea}

/* ปุ่ม */
.btn-add{width:100%;height:46px;border-radius:8px;border:0;
  background:var(--pri-soft);color:var(--pri);font-size:16px;font-weight:600;
  cursor:pointer;font-family:inherit;margin-bottom:10px;transition:opacity .15s}
.btn-add:hover{opacity:.85}
.bc{width:100%;height:48px;border-radius:8px;border:none;background:var(--pri);
  color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.bc:hover{background:var(--pri-dk)}
.bc:active{opacity:.9}

/* หน้าผลลัพธ์ */
.bk{height:40px;padding:0 16px;border-radius:8px;border:0;background:transparent;
  color:var(--pri);font-size:15px;font-weight:600;cursor:pointer;
  font-family:inherit;margin-bottom:12px}
.bk:hover{background:var(--pri-soft)}
.job-title{font-size:20px;font-weight:600;margin-bottom:2px}
.job-sub{font-size:13px;color:var(--tx2);margin-bottom:16px}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.me{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.ml{font-size:12px;color:var(--tx2);margin-bottom:4px;font-weight:500}
.mv{font-size:20px;font-weight:600;color:var(--tx)}
.mb{font-size:13px;color:var(--pri);margin-top:2px;font-weight:600}
.ts{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ta{padding:9px 18px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--tx2);font-size:14px;cursor:pointer;
  font-family:inherit;font-weight:600;transition:all .15s}
.ta:hover{border-color:var(--pri);color:var(--pri)}
.ta.on{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}

/* ตาราง */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--tx2);font-size:12px;
  background:transparent;border-bottom:1px solid var(--line);padding:10px 8px}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
.tfr td{font-weight:600;background:var(--pri-soft);color:var(--pri);
  padding:12px 8px;font-size:14px;border:0}

/* กล่องสูตร / ราคา */
.fb2{background:var(--bg);border-radius:8px;padding:12px 14px;margin-bottom:12px;
  font-size:13px;color:var(--tx2);line-height:1.9;border:0}
.fb2 b{color:var(--tx);font-weight:600}
.pr{display:flex;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:15px}
.pr:last-child{border-bottom:none}
.tr2{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 0 4px;margin-top:8px;border-top:1px solid var(--line)}

/* กระจก */
.gb{background:var(--pri-soft);border:0;border-radius:8px;padding:11px 14px;
  margin-bottom:8px;font-size:14px;color:var(--pri);font-weight:600}
.go{border:0;background:var(--bg);border-radius:8px;padding:9px 14px;
  margin-bottom:6px;font-size:13px;color:var(--tx2)}
.st{font-size:16px;font-weight:600;color:var(--tx);margin-bottom:12px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.item-header{background:var(--pri-soft);color:var(--pri);border-radius:8px;
  padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:10px}

/* จอเล็ก */
@media(max-width:640px){
  body{padding:12px}
  .ms{grid-template-columns:repeat(2,1fr)}
  .tg{grid-template-columns:repeat(2,1fr)}
  .g3,.g4,.g5,.fg,.tg2{grid-template-columns:repeat(2,1fr)}
  table{font-size:13px}
  th,td{padding:9px 6px}
}
</style>
</head>
<body>
<!-- หน้ากรอกข้อมูล -->
<div class="page show" id="pg-in">
<h1>ถอดแบบงานอลูมิเนียม ALUMET</h1>
<!-- 1. ชื่องาน -->
<div class="card">
<div class="sl">ข้อมูลงาน</div>
<div class="fd"><label>ชื่องาน</label><input type="text" id="JN" placeholder="เช่น บ้านคุณสมชาย"></div>
<div class="fd" style="margin-top:10px"><label>ชื่อชุดที่จะเพิ่ม</label><input type="text" id="INAME" placeholder="เช่น ห้องนอน, ห้องนั่งเล่น"></div>
</div>
<!-- 2. สีอลูมิเนียม / 3. สีกระจก -->
<div class="card">
<div class="sl">สีและวัสดุ</div>
<div class="g3">
<div class="fd"><label>สีอลูมิเนียม</label>
<select id="COL">
<option value="p">สีอบขาว (พ่น)</option>
<option value="p">สีขาวฟ้า (พ่น)</option>
<option value="p">สีดำพ่น</option>
<option value="a">สีดำชุบ</option>
<option value="a">สีชา (ชุบ)</option>
<option value="a">สีอลูมิเนียม (ชุบ)</option>
</select>
</div>
<div class="fd"><label>สีกระจก</label>
<select id="GCOL">
<option value="clear">กระจกใส</option>
<option value="green">กระจกเขียวใส</option>
<option value="bronze">กระจกชา</option>
<option value="frosted">กระจกฝ้า</option>
<option value="oneway">กระจกวันเวย์</option>
<option value="blue">กระจกฟ้าใส</option>
</select>
</div>
<div class="fd"><label>ความหนากระจก</label>
<select id="GTHK">
<option value="5">5 มม.</option>
<option value="6" selected>6 มม.</option>
<option value="8">8 มม.</option>
<option value="10">10 มม.</option>
<option value="12">12 มม.</option>
</select>
</div>
</div>
</div>
<!-- 4. ประเภทบาน -->
<div class="card">
<div class="sl">ประเภทบาน</div>
<div class="cat-tabs">
<button class="cat-tab on" data-cat="slide">บานเลื่อน</button>
<button class="cat-tab" data-cat="swing">บานสวิง</button>
</div>
<div id="type-area">
<div class="tg" id="tg"></div>
</div>
<!-- บานสวิง -->
<div id="swing-area" style="display:none">
<div class="tg" id="tg-swing"></div>
<div class="tg2" style="margin-top:12px">
<div class="tc">
<div class="fl">ความหนากล่อง/เสา</div>
<select id="thSW1"></select>
<div class="info" id="infoSW1"></div>
</div>
<div class="tc">
<div class="fl">ความหนาคิ้วประตู (3020)</div>
<select id="thSW2"></select>
<div class="info" id="infoSW2"></div>
</div>
</div>
</div>
</div>
<!-- 5. ขนาดช่องและจำนวน + รูปจำลอง -->
<div class="card">
<div class="sl">ขนาดช่องและจำนวน</div>
<div class="g3">
<div class="fd"><label>กว้างช่อง (ซม.)</label>
<input type="number" id="W" min="30" step="0.1" placeholder="กว้าง (ซม.)" oninput="uDg();rHint()">
</div>
<div class="fd"><label>สูงช่อง (ซม.)</label>
<input type="number" id="H" min="30" step="0.1" placeholder="สูง (ซม.)" oninput="uDg();rHint()">
</div>
<div class="fd"><label>จำนวนชุด</label>
<input type="number" id="QT" min="1" placeholder="จำนวนชุด">
</div>
</div>
<div id="dg"></div>
<div id="hi"></div>
</div>
<!-- 6. เลือกเฟรม -->
<div class="card" id="frame-card">
<div class="sl">เลือกเฟรม</div>
<div class="fg">
<div class="fc">
<div class="fl">เฟรมบน</div>
<select id="sft"></select>
<div class="fw" id="wft"></div>
</div>
<div class="fc">
<div class="fl">เฟรมล่าง</div>
<select id="sfb"></select>
<div class="fw" id="wfb"></div>
</div>
<div class="fc">
<div class="fl">เฟรมข้าง</div>
<select id="sfs"></select>
<div class="fw" id="wfs"></div>
</div>
</div>
</div>
<!-- 5. ขนาดช่องและจำนวน -->
<div class="card">
<div class="sl">ขนาดช่องและจำนวน</div>
<div class="g3">
<div class="fd"><label>กว้างช่อง (ซม.)</label>
<input type="number" id="W" min="30" step="0.1" placeholder="กว้าง (ซม.)" oninput="uDg();rHint()">
</div>
<div class="fd"><label>สูงช่อง (ซม.)</label>
<input type="number" id="H" min="30" step="0.1" placeholder="สูง (ซม.)" oninput="uDg();rHint()">
</div>
<div class="fd"><label>จำนวนชุด</label>
<input type="number" id="QT" min="1" placeholder="จำนวนชุด">
</div>
</div>
</div>
<div class="card" id="thick-card">
<div class="sl">ความหนาเส้น</div>
<div class="tg2">
<div class="tc">
<div class="fl">กลุ่มเฟรม (บน / ล่าง / ข้าง)</div>
<select id="thF"></select>
<div class="info" id="infoF"></div>
</div>
<div class="tc">
<div class="fl">กลุ่มบาน (ขวาง / เสา)</div>
<select id="thS"></select>
<div class="info" id="infoS"></div>
</div>
</div>
</div>
<!-- 6. ราคา -->
<div class="card">
<div class="sl">ราคา</div>
<div class="g2">
<div class="fd"><label>ราคาอลูมิเนียม (บาท/กก.)</label><input type="number" id="AP" value="120" step="1"></div>
<div class="fd"><label>ราคากระจก (บาท/ตร.ฟุต)</label><input type="number" id="GP" value="23" step="1"></div>
</div>
</div>
<!-- 7. รายการที่เพิ่มแล้ว -->
<div id="list-card" style="display:none">
<div class="card">
<div class="sl">รายการที่เพิ่มแล้ว</div>
<div class="item-list" id="item-list"></div>
</div>
</div>
<!-- 8. ปุ่มเพิ่ม -->
<button class="btn-add" id="btn-add">+ เพิ่มรายการนี้</button>
<!-- 9. ปุ่มคำนวณ -->
<button class="bc" id="btnc" style="display:none">คำนวณทั้งหมด →</button>
</div>
<!-- หน้าผลลัพธ์ -->
<div class="page" id="pg-out">
<button class="bk" id="btnbk">← แก้ไขข้อมูล</button>
<div class="job-title" id="out-jn"></div>
<div class="job-sub" id="out-sub"></div>
<div class="ms" id="ms"></div>
<div class="ts" id="ts">
<button class="ta on" data-t="pc">รายการตัด</button>
<button class="ta" data-t="pb">เส้นที่ซื้อ</button>
<button class="ta" data-t="pg">กระจก</button>
<button class="ta" data-t="pp">ราคารวม</button>
</div>
<div class="card" id="pc"></div>
<div class="card" id="pb" style="display:none"></div>
<div class="card" id="pg" style="display:none"></div>
<div class="card" id="pp" style="display:none"></div>
</div>

var T=TY.find(function(t){return t.id===item.ct;});
var ano=item.col==="a";
function getW(code,thk){var pd=PD[code]||PD[rc(code)];if(!pd)return 0;var v=pickV(pd,thk);if(!v)return 0;return ano?v.a:v.p;}
var hasMid=FS_MID[item.fsC]||false;
var hr=gHR(item.ftC,item.fbC);
var fsRW=FS_RW[item.fsC]||1.2;
var rw=T.rw+(hasMid?0.3:0);
var fW=rn(item.W-fsRW,2);
var sW=rn((item.W-fsRW-rw)/T.dv,2);
var sH=rn(item.H-hr.v,2);
var sc=T.sc;var qty=item.qty;
var wFT=getW(item.ftC,item.fThk),wFB=getW(item.fbC,item.fThk),wFS=getW(item.fsC,item.fThk);
var wTop=getW("4014",item.sThk),wBot=getW("4015",item.sThk);
var wKey=getW("4011",item.sThk),wHook=getW("4012",item.sThk),wDead=getW("4013",item.sThk);
var wMid=getW("4016",item.sThk);
var rows=[
{n:"เฟรมบน",c:item.ftC,dim:fW,pcs:qty,w:wFT,cat:"f"},
{n:"เฟรมล่าง",c:item.fbC,dim:fW,pcs:qty,w:wFB,cat:"f"},
{n:"เฟรมข้าง",c:item.fsC,dim:item.H,pcs:2*qty,w:wFS,cat:"f"},
{n:"ขวางบน",c:"4014",dim:sW,pcs:T.pn*qty,w:wTop,cat:"s"},
{n:"ขวางล่าง",c:"4015",dim:sW,pcs:T.pn*qty,w:wBot,cat:"s"},
];
if(sc.k>0)rows.push({n:"เสากุญแจ",c:"4011",dim:sH,pcs:sc.k*qty,w:wKey,cat:"s"});
if(sc.h>0)rows.push({n:"เสาเกี่ยว",c:"4012",dim:sH,pcs:sc.h*qty,w:wHook,cat:"s"});
if(sc.d>0)rows.push({n:"เสาตาย",c:"4013",dim:sH,pcs:sc.d*qty,w:wDead,cat:"s"});
if(item.fsC==="3013f")rows.push({n:"เฟรมข้าง (4003)",c:"4003",dim:item.H,pcs:2*qty,w:getW("4003",item.fThk),cat:"f"});
if(hasMid)rows.push({n:"ชนกลาง (เฟรมข้าง)",c:"4016",dim:sH,pcs:qty,w:wMid,cat:"s"});
if(sc.m&&sc.m>0){
if(!hasMid)rows.push({n:"ชนกลาง (เสากุญแจ)",c:"4016",dim:sH,pcs:sc.m*qty,w:wMid,cat:"s"});
else rows.push({n:"ชนกลาง (เสากุญแจ) ใช้เศษ",c:"4016",dim:sH,pcs:sc.m*qty,w:wMid,cat:"s",note:"ใช้เศษ"});
}
var gWc=rn(sW+1.3,2),gHc=rn(sH-8.0,2);
return{cat:"slide",T:T,fW:fW,sW:sW,sH:sH,hr:hr,hasMid:hasMid,rw:rw,fsRW:fsRW,rows:rows,gWc:gWc,gHc:gHc,qty:qty};
}
function calcSwingItem(item){
var ano=item.col==="a";
function getW(code,thk){var pd=PD[code];if(!pd)return 0;var v=pickV(pd,thk);if(!v)return 0;return ano?v.a:v.p;}
var W=item.W,H=item.H,qty=item.qty,isDouble=item.ct==="sw2";
var thk1=item.swThk1,thk2=item.swThk2;
var boxW=rn(W-9.0,2);
var poleH=rn(H-6.5,2);
var poleTopW=isDouble?rn((W-31.5)/2,2):rn(W-20.4,2);
var trimH=rn(H-19.6,2);
var trimW=isDouble?rn((W-31.5)/2,2):rn(W-20.4,2);
var nPole=isDouble?4:2,nPoleTop=isDouble?2:1,nTrim=isDouble?8:4;
var rows=[
{n:"กล่องเรียบ",c:"3013s",dim:H,pcs:2*qty,w:getW("3013s",thk1)},
{n:"กล่องแจ็คสัน",c:"3026",dim:boxW,pcs:qty,w:getW("3026",thk1)},
{n:"ฝาแจ็คสัน",c:"3027",dim:boxW,pcs:qty,w:getW("3027",thk1)},
{n:"ธรณีบานสวิง",c:"3067",dim:boxW,pcs:qty,w:getW("3067",thk1)},
{n:"เสาประตู",c:"3030",dim:poleH,pcs:nPole*qty,w:getW("3030",thk1)},
{n:"เสาประตูบน",c:"3031",dim:poleTopW,pcs:nPoleTop*qty,w:getW("3031",thk1)},
{n:"เสาประตูล่าง",c:"3032",dim:poleTopW,pcs:nPoleTop*qty,w:getW("3032",thk1)},
{n:"คิ้วประตู (สูง)",c:"3020",dim:trimH,pcs:nTrim*qty,w:getW("3020",thk2)},
{n:"คิ้วประตู (กว้าง)",c:"3020",dim:trimW,pcs:nTrim*qty,w:getW("3020",thk2)},
];
var gWc=rn(poleTopW-1.0+(isDouble?-1.0:0),2);
var gHc=rn(poleH-14.0,2);
return{cat:"swing",rows:rows,W:W,H:H,boxW:boxW,poleH:poleH,poleTopW:poleTopW,trimH:trimH,trimW:trimW,isDouble:isDouble,qty:qty,gWc:gWc,gHc:gHc};
}

function calcAll(){

var ap=parseFloat(g("AP").value)||120;

});

r.rows.forEach(function(row){

});
});
Object.keys(piecesByCode).forEach(function(k){piecesByCode[k].nb=calcBars(piecesByCode[k].pieces);});
var totKg=0;
Object.keys(piecesByCode).forEach(function(k){totKg+=piecesByCode[k].nb*piecesByCode[k].w;});

allResults.forEach(function(r,idx){

}
totGlass+=(r.gWc/2.54)*(r.gHc/2.54)/144*r.T.sl*r.qty;
});
totGlass=rn(totGlass,2);
var gCostTotal=rn(totGlass*gp,0);
var totQty=ITEMS.reduce(function(s,item){return s+item.qty;},0);
g("out-jn").textContent=jn;
g("out-sub").textContent=ITEMS.length+" รายการ | "+totQty+" ชุดรวม";
g("ms").innerHTML=
'<div class="me"><div class="ml">งาน</div><div class="mv">'+jn+'</div><div class="mb">'+ITEMS.length+' รายการ</div></div>'+
'<div class="me"><div class="ml">น้ำหนักอลูมิเนียม</div><div class="mv">'+fm(totKg,2)+' กก.</div><div class="mb">฿'+fm(alCost)+'</div></div>'+
'<div class="me"><div class="ml">กระจก '+gColTxt+'</div><div class="mv">'+fm(totGlass,2)+' ตร.ฟุต</div><div class="mb">฿'+fm(gCostTotal)+'</div></div>'+
'<div class="me"><div class="ml">รวมทั้งหมด</div><div class="mv">฿'+fm(alCost+gCostTotal)+'</div><div class="mb">&nbsp;</div></div>';
var ch='<div class="st">รายการตัดแยกตามชุด</div>';
ITEMS.forEach(function(item,idx){
var r=allResults[idx];var lbl=T_LABELS[item.ct]||item.ct;
ch+='<div class="item-header">'+item.iname+' - '+lbl+' '+item.W+'x'+item.H+' ซม. x'+item.qty+' ชุด | '+item.colTxt+'</div>';
if(r.cat==="slide"){
ch+='<div class="fb2"><b>เฟรมบน-ล่าง</b> = <b>'+r.fW+' ซม.</b> | <b>ขวาง</b> = <b>'+r.sW+' ซม./บาน</b> | <b>เสา</b> = <b>'+r.sH+' ซม.</b> | <b>กระจก</b> = <b>'+rn(r.gWc/2.54,2)+'x'+rn(r.gHc/2.54,2)+' นิ้ว</b>'+(r.hasMid?' | มีชนกลาง':'')+'</div>';
} else {
ch+='<div class="fb2"><b>กล่องแจ็คสัน/ธรณี</b> = <b>'+r.boxW+' ซม.</b> | <b>เสาประตู</b> = <b>'+r.poleH+' ซม.</b> | <b>เสาบน-ล่าง</b> = <b>'+r.poleTopW+' ซม.</b></div>';
}
ch+='<table><thead><tr><th style="width:25%">เส้น</th><th style="width:35%">ชื่อ</th><th>ยาว(ซม.)</th><th>ชิ้นรวม</th></tr></thead><tbody>';
r.rows.forEach(function(row){
var nm=PD[row.c]?PD[row.c].n:row.c;
var noteStr=row.note?' <span style="color:#28a745;font-size:12px">('+row.note+')</span>':'';
ch+='<tr><td><b>'+row.n+'</b>'+noteStr+'</td><td style="font-size:13px;color:#6b7280">'+nm+'</td><td><b>'+fm(row.dim,2)+'</b></td><td>'+row.pcs+'</td></tr>';
});
ch+='</tbody></table><br>';
});
g("pc").innerHTML=ch;
var bh='<div class="st">สรุปเส้นที่ต้องซื้อทั้งงาน</div>'+
'<table><thead><tr><th style="width:25%">รายการ</th><th style="width:35%">ชื่อเส้น</th><th>จำนวนเส้น</th><th>น้ำหนัก/เส้น</th><th>น้ำหนักรวม(กก.)</th><th>ราคา(บาท)</th></tr></thead><tbody>';
var sB=0,sK=0,sC=0;
Object.keys(piecesByCode).forEach(function(k){
var gg=piecesByCode[k];var tw=rn(gg.nb*gg.w,2);var cost=rn(tw*ap,0);sB+=gg.nb;sK+=tw;sC+=cost;

bh+='<tr><td><b>'+gg.n+'</b></td><td style="font-size:13px;color:#6b7280">'+nm+'</td><td><b style="color:#1860a8">'+gg.nb+' เส้น</b></td><td>'+gg.w+' กก.</td><td>'+fm(tw,2)+'</td><td>฿'+fm(cost)+'</td></tr>';
});
bh+='</tbody><tfoot><tr class="tfr"><td colspan="2">รวมทั้งหมด</td><td><b>'+sB+' เส้น</b></td><td></td><td><b>'+fm(rn(sK,2),2)+' กก.</b></td><td><b>฿'+fm(rn(sC,0))+'</b></td></tr></tfoot></table>';
g("pb").innerHTML=bh;
var gh='<div class="st">กระจก '+gColTxt+' '+gThk+' มม.</div>';
ITEMS.forEach(function(item,idx){
if(item.cat==="swing"){
var r2=allResults[idx];
var gWi2=rn(r2.gWc/2.54,2),gHi2=rn(r2.gHc/2.54,2);

gh+='<div class="item-header">'+item.iname+' - '+T_LABELS[item.ct]+' '+item.W+'x'+item.H+' ซม. x'+item.qty+' ชุด</div>';
gh+='<div class="fb2"><b>กระจก/บาน:</b> '+gWi2+'x'+gHi2+' นิ้ว ('+rn(gWi2*gHi2,1)+' ตร.นิ้ว)<br>กว้าง = เสาบน-ล่าง'+(r2.isDouble?' - 2.0':' - 1.0')+' = '+r2.gWc+' ซม. | สูง = เสาประตู - 14.0 = '+r2.gHc+' ซม.</div>';
if(best2)gh+='<div class="gb">แนะนำ: <b>'+best2.w+'x'+best2.h+' นิ้ว</b> '+best2.m+' x'+item.qty+' = <b>฿'+fm(best2.c*item.qty)+'</b></div>';
var seen2=[];
GS.forEach(function(sz){[[sz[0],sz[1]],[sz[1],sz[0]]].forEach(function(o){

});});

gh+='<div class="item-header">'+item.iname+' - '+gWi+'x'+gHi+' นิ้ว | '+ns+' บาน x'+qty+' ชุด</div>';

});});
gh+='<br>';
});

});
ph+='<div class="tr2"><span style="font-weight:600;font-size:16px">รวมอลูมิเนียม</span><span style="font-size:19px;font-weight:600">฿'+fm(alCost)+'</span></div>';
ph+='<div class="tr2"><span style="font-weight:600;font-size:16px">รวมกระจก</span><span style="font-size:19px;font-weight:600">฿'+fm(gCostTotal)+'</span></div>';
ph+='<div class="tr2" style="border-top:2px solid #1860a8"><span style="font-weight:600;font-size:18px">รวมทั้งหมด</span><span style="font-size:26px;font-weight:700;color:#1860a8">฿'+fm(alCost+gCostTotal)+'</span></div>';
